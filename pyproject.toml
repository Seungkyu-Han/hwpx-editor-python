[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-editor"
version = "0.0.0"
description = "A lightweight Python library for reading, modifying, and generating HWPX (Hangul Word Processor XML) documents."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = [
    "Document",
    "hwpx",
]
authors = [
    {name = "Seungkyu-Han", email="trust1204@gmail.com"}
]

dependencies = [
    "pydantic>=2.13.5",
    "lxml>=6.1.3",
]

[project.urls]
"Homepage" = "https://github.com/Seungkyu-Han/hwpx-editor-python"
"Bug Tracker" = "https://github.com/Seungkyu-Han/hwpx-editor-python"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.setuptools.packages.find]
where = ["."]
include = ["hwpx_editor*"]